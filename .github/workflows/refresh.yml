name: Refresh Dota2 data

# 每天 06:00 UTC (北京时间 14:00) 自动刷新英雄数据并部署
# 也支持手动触发（Actions 页面点 "Run workflow"）
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Pillow 与中文字体（用于生成周报长图）
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-wqy-zenhei
          python3 -m pip install pillow

      - name: 拉取 OpenDota 数据，生成 herostats.json + 周报(md/png)
        run: python3 scripts/fetch_hero_data.py --markdown --image

      # 关键：把现场生成的数据文件提交回仓库，
      # 这样任何部署流程都带着最新数据，数据不会因部署被覆盖丢失
      - name: 提交数据回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/data/herostats.json site/data/weekly_report.md site/data/weekly_report.png
          # 若无变化则跳过提交（避免空提交触发无限循环）
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 自动刷新 Dota2 英雄数据 [skip ci]"
            git push origin main
          fi

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
